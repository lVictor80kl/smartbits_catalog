<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartbits Sync eBay</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --surface-color: #111827;
      --card-bg: #1e293b;
      --card-hover: #24344d;
      --border-color: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 460px;
      height: 560px;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 12px 16px;
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: white;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 9px;
      color: #60a5fa;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .user-pill {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #1e293b;
      padding: 3px 8px;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .btn-logout {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-logout:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      padding: 14px 16px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Views */
    #view-login {
      display: none;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }

    #view-sync {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 10px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      height: 42px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      flex-shrink: 0;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.15s;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .alert {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .alert-warn {
      background-color: #422006;
      border: 1px solid #ca8a04;
      color: #fef08a;
    }

    .alert-error {
      background-color: #450a0a;
      border: 1px solid #dc2626;
      color: #fca5a5;
    }

    .alert-success {
      background-color: #064e3b;
      border: 1px solid #10b981;
      color: #a7f3d0;
    }

    /* Order List & Controls */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
      border: 1px solid #334155;
    }

    .orders-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .orders-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .orders-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .order-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .order-card:hover {
      background-color: var(--card-hover);
      border-color: #475569;
    }

    .order-card.selected {
      border-color: #3b82f6;
      background-color: rgba(37, 99, 235, 0.1);
    }

    .order-img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .order-info {
      flex: 1;
      min-width: 0;
    }

    .order-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .order-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .price-tag {
      font-weight: 700;
      color: #34d399;
      font-size: 12px;
    }

    .tracking-tag {
      background-color: #1e3a8a;
      color: #93c5fd;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
    }

    footer {
      padding: 10px 16px;
      background-color: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">S</div>
      <div>
        <div class="brand-title">Smartbits Sync</div>
        <div class="brand-subtitle">eBay Purchases</div>
      </div>
    </div>
    <div id="user-header" class="user-pill" style="display: none;">
      <span id="user-email-label">admin</span>
      <button id="btn-logout" class="btn-logout">Salir</button>
    </div>
  </header>

  <main>
    <!-- LOGIN VIEW -->
    <div id="view-login">
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4;">
        Inicia sesión con tu cuenta de administrador de Smartbits para enviar las compras a Firestore.
      </p>

      <div id="login-alert" class="alert alert-error" style="display: none;"></div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="login-email" placeholder="admin@smartbits.com" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>

      <button id="btn-login" class="btn-primary" style="margin-top: 8px;">
        <span>Iniciar Sesión</span>
      </button>
    </div>

    <!-- MAIN SYNC VIEW -->
    <div id="view-sync">
      <!-- Alert if not on eBay -->
      <div id="not-ebay-alert" class="alert alert-warn" style="display: none;">
        <span>⚠️ Ve a tu <strong>Historial de Compras de eBay</strong> para extraer los pedidos.</span>
        <button id="btn-goto-ebay" class="btn-secondary" style="margin-left: auto; padding: 3px 6px; font-size: 10px;">Abrir</button>
      </div>

      <!-- Sync Status Alert -->
      <div id="sync-alert" class="alert" style="display: none;"></div>

      <div class="controls-bar">
        <div class="count-badge">
          <span id="orders-count-label">0 compras</span>
        </div>
        <div style="display: flex; gap: 6px;">
          <button id="btn-select-all" class="btn-secondary">Todas</button>
          <button id="btn-reextract" class="btn-secondary">🔄 Re-escanear</button>
        </div>
      </div>

      <!-- Order List Container -->
      <div id="orders-container" class="orders-scroll">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 12px;">
          Escaneando pedidos en la pestaña activa de eBay...
        </div>
      </div>

      <!-- Sync Button -->
      <button id="btn-sync" class="btn-primary" disabled>
        <span id="sync-spinner" class="spinner" style="display: none;"></span>
        <span id="sync-btn-text">Sincronizar Seleccionadas con Smartbits</span>
      </button>
    </div>
  </main>

  <footer>
    <span>Smartbits v1.0</span>
    <a id="link-admin-panel" href="http://localhost:5173/admin/compras-ebay" target="_blank">Ir al Panel Admin ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
